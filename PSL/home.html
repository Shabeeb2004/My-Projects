<style>
  .hero {
    padding: 48px 24px 40px;
    position: relative; z-index: 1;
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }
  .hero::after {
    content: 'PSL\A2026';
    white-space: pre;
    position: absolute;
    right: 0; top: 0;
    font-family: var(--font-head);
    font-size: 120px;
    line-height: 1;
    color: rgba(0,230,118,.03);
    pointer-events: none;
  }
  .hero__eyebrow {
    font-family: var(--font-cond);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 8px;
  }
  .hero__title {
    font-family: var(--font-head);
    font-size: clamp(40px, 6vw, 72px);
    letter-spacing: 3px;
    line-height: 1;
    color: var(--text);
    margin-bottom: 6px;
  }
  .hero__title span { color: var(--gold); }
  .hero__sub { color: var(--text-dim); font-size: 15px; margin-bottom: 28px; max-width: 560px; }
  .hero__actions { display: flex; gap: 12px; flex-wrap: wrap; }

  .main-grid {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 24px;
    padding: 28px 24px;
    position: relative; z-index: 1;
  }
  @media(max-width:900px) { .main-grid { grid-template-columns: 1fr; } }

  /* Progress steps */
  .steps { display: flex; flex-direction: column; gap: 12px; }
  .step {
    display: flex; align-items: center; gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    text-decoration: none;
    color: var(--text);
    transition: border-color .2s, transform .15s;
    position: relative; overflow: hidden;
  }
  .step:hover:not(.step--locked) { border-color: var(--green); transform: translateX(4px); }
  .step--done  { border-color: rgba(0,230,118,.3); }
  .step--active { border-color: var(--green); box-shadow: 0 0 20px rgba(0,230,118,.1); }
  .step--locked { opacity: .45; cursor: not-allowed; }
  .step__num {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-head);
    font-size: 22px;
    border: 2px solid var(--border2);
    flex-shrink: 0;
    color: var(--text-dim);
  }
  .step--done .step__num  { background: var(--green); border-color: var(--green); color: #000; }
  .step--active .step__num{ background: var(--green-glow); border-color: var(--green); color: var(--green); }
  .step__body { flex: 1; }
  .step__title {
    font-family: var(--font-cond);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .5px;
    margin-bottom: 2px;
  }
  .step__desc { color: var(--text-dim); font-size: 13px; }
  .step__badge {
    font-family: var(--font-cond);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 3px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .badge--done    { background: rgba(0,230,118,.15); color: var(--green); border: 1px solid rgba(0,230,118,.3); }
  .badge--active  { background: var(--green); color: #000; }
  .badge--locked  { background: var(--border); color: var(--text-muted); }
  .badge--partial { background: rgba(255,196,0,.1); color: var(--gold); border: 1px solid rgba(255,196,0,.25); }

  /* Teams grid */
  .teams-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .team-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .team-row__name {
    font-family: var(--font-cond);
    font-size: 14px;
    font-weight: 700;
  }
  .team-row__group {
    font-family: var(--font-cond);
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 1px;
    margin-left: auto;
  }

  /* Sidebar */
  .sidebar { display: flex; flex-direction: column; gap: 16px; }

  .info-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .info-card__head {
    padding: 12px 16px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    font-family: var(--font-cond);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .info-card__body { padding: 16px; }

  .stat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .stat-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    text-align: center;
  }
  .stat-box .val {
    font-family: var(--font-head);
    font-size: 28px;
    color: var(--green);
    display: block;
    line-height: 1;
  }
  .stat-box .lbl {
    font-family: var(--font-cond);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    display: block;
    margin-top: 4px;
  }

  /* Recent predictors */
  .predictor-list { display: flex; flex-direction: column; gap: 8px; }
  .predictor-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  .predictor-row__name {
    font-family: var(--font-cond);
    font-weight: 700;
    font-size: 15px;
  }
  .predictor-row__tag {
    font-family: var(--font-cond);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 2px 8px;
    border-radius: 3px;
    text-transform: uppercase;
  }
  .tag-complete { background: rgba(0,230,118,.1); color: var(--green); border: 1px solid rgba(0,230,118,.25); }
  .tag-partial  { background: rgba(255,196,0,.1); color: var(--gold); border: 1px solid rgba(255,196,0,.2); }

  /* Schedule highlights */
  .schedule-item {
    display: flex; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .schedule-item:last-child { border-bottom: none; }
  .schedule-item__date {
    font-family: var(--font-cond);
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    white-space: nowrap;
    width: 48px;
    flex-shrink: 0;
  }
  .schedule-item__teams {
    font-family: var(--font-cond);
    font-size: 14px;
    font-weight: 700;
    flex: 1;
  }
  .schedule-item__venue {
    font-size: 12px;
    color: var(--text-muted);
  }
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>

<script src="data.js"></script>
<script>
  const username = requireLogin();

  // Show loading state
  document.getElementById('nav-placeholder').innerHTML = renderNav('home');

  async function initPage() {
    // Load latest data from Firebase for this user
    await pageInit(username);

    const u = getUser(username);
    if (!u) { window.location.href = 'index.html'; return; }

    const predCount = Object.keys(u.predictions || {}).length;
    const allGroupDone = predCount >= GROUP_MATCHES.length;
    const playoffDone  = !!u.playoffsComplete;

    // Re-render nav with fresh data
    document.getElementById('nav-placeholder').innerHTML = renderNav('home');

    // ── Match 12 correction: show banner if playoffs were reset ──
    if (u.playoffResetReason === 'match12_correction' && !u.playoffsComplete) {
      const banner = document.createElement('div');
      banner.style.cssText = 'background:rgba(255,196,0,.1);border:1px solid rgba(255,196,0,.4);border-radius:8px;padding:14px 20px;margin:16px 0;font-family:var(--font-cond);font-size:14px;font-weight:600;color:var(--gold);line-height:1.6;position:relative;z-index:1;';
      banner.innerHTML = `⚠️ <strong>Action Required:</strong> Match 12 was corrected (Hyderabad Kingsmen replaced by RawalPINDIZ). Your predicted qualifiers changed, so your playoff bracket has been reset. Please <a href="playoffs.html" style="color:var(--gold);text-decoration:underline;font-weight:700;">re-predict the playoffs</a>.`;
      const heroSection = document.querySelector('.hero');
      if (heroSection) heroSection.insertAdjacentElement('afterend', banner);
    }

    // Hero CTA
    document.getElementById('hero-actions').innerHTML = allGroupDone
      ? playoffDone
        ? `<a href="community.html" class="btn btn--gold">See All Predictions &rarr;</a>`
        : `<a href="playoffs.html" class="btn btn--gold">Pick Playoffs &rarr;</a>`
      : `<a href="predict.html" class="btn btn--primary">Start Predicting &rarr;</a>
         <a href="#steps" class="btn btn--outline">How it works</a>`;

    // Steps
    const stepDefs = [
      { num:'1', title:'Group Stage Predictions',
        desc:`Predict winners for all 40 group matches (${predCount}/${GROUP_MATCHES.length} done)`,
        href:'predict.html',
        state: predCount===0?'active':allGroupDone?'done':'active',
        badge: predCount===0?'Start':allGroupDone?'Done ✓':`${predCount}/${GROUP_MATCHES.length}` },
      { num:'2', title:'Playoff Bracket',
        desc:'Pick winners for Qualifier, Eliminators & Final',
        href:'playoffs.html',
        state:!allGroupDone?'locked':playoffDone?'done':'active',
        badge:!allGroupDone?'Locked':playoffDone?'Done ✓':'Ready' },
      { num:'3', title:'Community Predictions',
        desc:"See everyone else's playoff picks after you submit yours",
        href:'community.html',
        state:!playoffDone?'locked':'active',
        badge:!playoffDone?'Locked':'View' },
    ];
    document.getElementById('steps').innerHTML = stepDefs.map(s => {
      const cls = `step step--${s.state}`;
      const badgeCls = s.state==='done'?'badge--done':s.state==='active'?'badge--active':s.badge.includes('/')?'badge--partial':'badge--locked';
      const tag = s.state!=='locked' ? `<a href="${s.href}" class="${cls}" style="text-decoration:none;">` : `<div class="${cls}">`;
      const end = s.state!=='locked' ? '</a>' : '</div>';
      return `${tag}<div class="step__num">${s.state==='done'?'✓':s.num}</div>
        <div class="step__body"><div class="step__title">${s.title}</div><div class="step__desc">${s.desc}</div></div>
        <span class="step__badge ${badgeCls}">${s.badge}</span>${end}`;
    }).join('');

    // Teams grid
    const grpALabel = `<div class="mt-8 mb-8" style="grid-column:1/-1;font-family:var(--font-cond);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--green);">GROUP A</div>`;
    const grpBLabel = `<div class="mt-8 mb-8" style="grid-column:1/-1;font-family:var(--font-cond);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);">GROUP B</div>`;
    const renderTeamRow = key => {
      const t = TEAMS[key];
      return `<div class="team-row">${teamAvatar(key,34)}<div><div class="team-row__name">${t.name}</div><div style="font-size:12px;color:var(--text-muted);">${t.abbr}</div></div><div class="team-row__group">GRP ${t.group}</div></div>`;
    };
    document.getElementById('teams-grid').innerHTML =
      grpALabel + ['LQ','KK','PZ','QG'].map(renderTeamRow).join('') +
      grpBLabel + ['RP','IU','MS','HK'].map(renderTeamRow).join('');

    // Load all users for stats & predictors list
    const allUsers = await loadAllUsers();
    const completedAll = Object.values(allUsers).filter(u => u.playoffsComplete).length;
    document.getElementById('user-stats').innerHTML = `
      <div class="stat-box"><span class="val">${predCount}</span><span class="lbl">Picks Made</span></div>
      <div class="stat-box"><span class="val">${GROUP_MATCHES.length-predCount}</span><span class="lbl">Remaining</span></div>
      <div class="stat-box"><span class="val">${Object.keys(allUsers).length}</span><span class="lbl">Total Users</span></div>
      <div class="stat-box"><span class="val">${completedAll}</span><span class="lbl">Completed</span></div>`;

    const uArr = Object.values(allUsers).sort((a,b) => {
      const sa = a.playoffsComplete?2:Object.keys(a.predictions||{}).length>0?1:0;
      const sb = b.playoffsComplete?2:Object.keys(b.predictions||{}).length>0?1:0;
      return sb-sa;
    });
    // Show predictor count & progress without revealing names
    const totalPredictors = uArr.length;
    const completedCount  = uArr.filter(u => u.playoffsComplete).length;
    const inProgressCount = uArr.filter(u => !u.playoffsComplete && Object.keys(u.predictions||{}).length > 0).length;
    const notStartedCount = totalPredictors - completedCount - inProgressCount;

    if (!totalPredictors) {
      document.getElementById('predictor-list').innerHTML = '<p style="color:var(--text-muted);font-size:13px;">No predictors yet</p>';
    } else {
      document.getElementById('predictor-list').innerHTML = `
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;">
            <div>
              <div style="font-family:var(--font-head);font-size:28px;color:var(--green);line-height:1;">${completedCount}</div>
              <div style="font-family:var(--font-cond);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-top:3px;">Fully Complete</div>
            </div>
            <span style="font-size:22px;">✅</span>
          </div>
          <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;">
            <div>
              <div style="font-family:var(--font-head);font-size:28px;color:var(--gold);line-height:1;">${inProgressCount}</div>
              <div style="font-family:var(--font-cond);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-top:3px;">In Progress</div>
            </div>
            <span style="font-size:22px;">⏳</span>
          </div>
          <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;">
            <div>
              <div style="font-family:var(--font-head);font-size:28px;color:var(--text-dim);line-height:1;">${notStartedCount}</div>
              <div style="font-family:var(--font-cond);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-top:3px;">Not Started</div>
            </div>
            <span style="font-size:22px;">🔒</span>
          </div>
        </div>`;
    }

    // Show next 5 matches that haven't kicked off yet (including playoff matches)
    const results = getResults();
    const upcomingMatches = MATCHES.filter(m => {
      try { return !isMatchLocked(m.id); } catch(e) { return true; }
    }).slice(0, 5);
    if (!upcomingMatches.length) {
      document.getElementById('upcoming').innerHTML = '<p style="color:var(--text-muted);font-size:13px;">No upcoming matches</p>';
    } else {
      document.getElementById('upcoming').innerHTML = upcomingMatches.map(m => {
        let t1key = m.t1, t2key = m.t2;
        let label = m.label || null;

        // For playoff matches, resolve actual team names from confirmed results
        if (m.type === 'P') {
          const roundMap = {41:'playoff_qualifier', 42:'playoff_elim1', 43:'playoff_elim2', 44:'playoff_final'};
          const teams = typeof getPlayoffMatchTeams === 'function'
            ? getPlayoffMatchTeams(roundMap[m.id])
            : null;
          if (teams) { t1key = teams.t1; t2key = teams.t2; }
        }

        const t1 = TEAMS[t1key], t2 = TEAMS[t2key];
        const isPlayoff = m.type === 'P';
        return `<div class="schedule-item" style="${isPlayoff?'border-left:2px solid var(--gold);padding-left:8px;':''}">
          ${label ? `<span style="font-family:var(--font-cond);font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;">${label}</span><br>` : ''}
          <div class="schedule-item__teams">
            <span style="color:${t1?.color||'var(--gold)'};">${t1?.abbr||t1key}</span>
            <span style="color:var(--text-muted);font-weight:400;"> vs </span>
            <span style="color:${t2?.color||'var(--gold)'};">${t2?.abbr||t2key}</span>
          </div>
          <span class="schedule-item__venue" style="font-size:11px;color:var(--text-muted);">${m.date} · ${m.time} · ${m.venue}</span>
        </div>`;
      }).join('');
    }
  }

  // Inject PSL logo in hero
  if (typeof LOGOS !== 'undefined' && LOGOS.PSL) {
    const el = document.getElementById('hero-psl-logo');
    if (el) el.innerHTML = `<img src="${LOGOS.PSL}" alt="HBL PSL 2026" style="height:56px;width:auto;"/>`;
  }
  initPage();
</script>
</body>
</html>
