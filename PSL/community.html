<style>
  .community-layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 0;
    min-height: calc(100vh - 80px);
    position: relative; z-index: 1;
  }
  @media(max-width:900px) { .community-layout { grid-template-columns: 1fr; } }

  /* ─── Sidebar ─── */
  .comm-sidebar {
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    position: sticky; top: 70px;
    height: calc(100vh - 70px);
    overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar-head {
    font-family: var(--font-cond);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .user-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 9px 10px;
    cursor: pointer;
    color: var(--text);
    font-family: var(--font-cond);
    font-size: 14px;
    font-weight: 600;
    text-align: left;
    transition: all .15s;
    margin-bottom: 4px;
  }
  .user-btn:hover { background: var(--surface); border-color: var(--border); }
  .user-btn.active { background: var(--surface); border-color: var(--green); color: var(--green); }
  .user-btn__you {
    font-size: 10px;
    background: var(--green);
    color: #000;
    padding: 1px 6px;
    border-radius: 2px;
    font-weight: 700;
    letter-spacing: .5px;
  }
  .user-btn__status {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-muted);
  }
  .user-btn.active .user-btn__status { color: var(--green); }

  /* ─── Main panel ─── */
  .comm-main { padding: 28px 28px; }

  /* Banner (your own) */
  .your-banner {
    background: linear-gradient(135deg, var(--surface2) 0%, var(--bg3) 100%);
    border: 1px solid rgba(0,230,118,.3);
    border-radius: 10px;
    padding: 20px 24px;
    margin-bottom: 24px;
    box-shadow: 0 0 30px rgba(0,230,118,.08);
    position: relative; overflow: hidden;
  }
  .your-banner::before {
    content:'YOU';
    position:absolute; right:-10px; top:-10px;
    font-family:var(--font-head);
    font-size:80px;
    color:rgba(0,230,118,.04);
    pointer-events:none; line-height:1;
  }
  .your-banner__label {
    font-family: var(--font-cond);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 6px;
  }
  .your-banner__name {
    font-family: var(--font-head);
    font-size: 36px;
    letter-spacing: 3px;
    margin-bottom: 16px;
  }

  /* Prediction display card */
  .pred-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    animation: fadeUp .35s ease;
  }
  .pred-card__head {
    background: var(--surface2);
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .pred-card__username {
    font-family: var(--font-head);
    font-size: 28px;
    letter-spacing: 2px;
    display: flex; align-items: center; gap: 10px;
  }
  .you-tag {
    font-size: 11px;
    font-family: var(--font-cond);
    font-weight: 700;
    background: var(--green);
    color: #000;
    padding: 2px 8px;
    border-radius: 3px;
    letter-spacing: 1px;
  }
  .pred-card__champion {
    text-align: right;
  }
  .pred-card__champion .champ-label {
    font-family: var(--font-cond);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .pred-card__champion .champ-name {
    font-family: var(--font-head);
    font-size: 22px;
    letter-spacing: 2px;
  }

  /* Bracket display */
  .bracket-display {
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 16px;
    position: relative;
  }
  @media(max-width:700px){ .bracket-display { grid-template-columns: 1fr 1fr; } }

  .bd-round {}
  .bd-round__title {
    font-family: var(--font-cond);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .bd-match {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .bd-team {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-family: var(--font-cond);
    font-size: 13px;
    font-weight: 700;
    transition: background .15s;
  }
  .bd-team:last-child { border-bottom: none; }
  .bd-team.winner {
    background: rgba(0,230,118,.08);
    color: var(--green);
  }
  .bd-team.loser { opacity: .4; }
  .bd-team .w-icon {
    margin-left: auto;
    font-size: 11px;
    color: var(--green);
  }
  .bd-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* Standing comparison across users */
  .champion-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 24px;
  }
  .champion-bar__head {
    background: var(--surface2);
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-family: var(--font-head);
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--gold);
  }
  .champion-bar__body { padding: 20px; }
  .champ-stat {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 12px;
  }
  .champ-stat:last-child { margin-bottom: 0; }
  .champ-stat__team {
    display: flex; align-items: center; gap: 8px;
    width: 180px; flex-shrink: 0;
    font-family: var(--font-cond);
    font-size: 14px;
    font-weight: 700;
  }
  .champ-stat__bar-wrap { flex: 1; background: var(--border); border-radius: 3px; height: 6px; }
  .champ-stat__bar { height: 100%; border-radius: 3px; transition: width .6s ease; }
  .champ-stat__count {
    font-family: var(--font-cond);
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    white-space: nowrap;
    width: 50px;
    text-align: right;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; display: block; }
  .empty-state h3 { font-family: var(--font-head); font-size: 28px; letter-spacing: 2px; margin-bottom: 8px; color: var(--text-dim); }
  .empty-state p { font-size: 14px; }
</style>
</head>
<body>
<div id="nav-placeholder"></div>

<div class="community-layout">
  <!-- Sidebar: user list -->
  <div class="comm-sidebar">
    <div class="sidebar-head">Predictors</div>
    <div id="user-list"></div>
  </div>

  <!-- Main: selected user's prediction -->
  <div class="comm-main">
    <div class="section-head mb-20">
      <div>
        <div style="font-family:var(--font-cond);font-size:12px;font-weight:700;letter-spacing:3px;color:var(--green);margin-bottom:6px;text-transform:uppercase;">Community</div>
        <h2 class="font-head" style="font-size:36px;letter-spacing:2px;">ALL PREDICTIONS</h2>
        <p class="text-dim" style="font-size:13px;margin-top:4px;">Browse every predictor's playoff picks. Select a user from the sidebar.</p>
      </div>
    </div>

    <div id="pred-display"></div>
    <div id="champion-chart"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="logos.js"></script>
<script src="data.js"></script>
<script>
  const username = requireLogin();
  let allUsers = {}, completedUsers = [], selectedUser = '';

  document.getElementById('nav-placeholder').innerHTML = renderNav('community');

  async function initPage() {
    await pageInit(username);

    const me = getUser(username);
    if (!me || !me.playoffsComplete) {
      alert('Complete your playoff predictions first!');
      window.location.href = 'playoffs.html'; return;
    }

    // Load ALL users from Firestore for community view
    allUsers = await loadAllUsers();

    completedUsers = Object.values(allUsers).filter(u => u.playoffsComplete);
    completedUsers.sort((a,b) => {
      if (a.username === username) return -1;
      if (b.username === username) return 1;
      return a.username.localeCompare(b.username);
    });

    selectedUser = username;
    document.getElementById('nav-placeholder').innerHTML = renderNav('community');
    renderUserList();
    renderPredDisplay();
  }

  // ─── Sidebar user list ───
  function renderUserList() {
    if (!completedUsers.length) {
      document.getElementById('user-list').innerHTML = '<p style="color:var(--text-muted);font-size:13px;padding:10px 0;">No completed predictions yet.</p>';
      return;
    }
    document.getElementById('user-list').innerHTML = completedUsers.map(u => `
      <button class="user-btn ${u.username === selectedUser ? 'active' : ''}" onclick="selectUser('${u.username}')">
        <span>${u.username}${u.username===username?` <span class="user-btn__you">YOU</span>`:''}</span>
        <span class="user-btn__status">✓</span>
      </button>
    `).join('');
  }

  // ─── Main prediction display ───
  function selectUser(uname) {
    selectedUser = uname;
    renderUserList();
    renderPredDisplay();
  }

  function renderPredDisplay() {
    const u = allUsers[selectedUser];
    if (!u || !u.playoffsComplete) {
      document.getElementById('pred-display').innerHTML = `
        <div class="empty-state">
          <span class="icon">🔒</span>
          <h3>No Predictions Yet</h3>
          <p>This user hasn't completed their bracket yet.</p>
        </div>`;
      return;
    }

    const pp = u.playoffPicks || {};
    const preds = u.predictions || {};
    const userTiebreakers = u.tiebreakers || {};
    const qualifiers = getQualifiers(preds, userTiebreakers);

    const q_t1 = qualifiers[0]?.team, q_t2 = qualifiers[1]?.team;
    const e1_t1 = qualifiers[2]?.team, e1_t2 = qualifiers[3]?.team;
    const qualWinner = pp.qualifier;
    const qualLoser  = qualWinner ? (qualWinner === q_t1 ? q_t2 : q_t1) : null;
    const e1Winner   = pp.elim1;
    const e2_t1 = qualLoser, e2_t2 = e1Winner;
    const e2Winner = pp.elim2;
    const f_t1 = qualWinner, f_t2 = e2Winner;
    const champion = pp.final;
    const champTeam = champion ? TEAMS[champion] : null;
    const isMe = selectedUser === username;

    document.getElementById('pred-display').innerHTML = `
      <div class="pred-card">
        <div class="pred-card__head">
          <div class="pred-card__username">
            ${selectedUser} ${isMe ? '<span class="you-tag">YOU</span>' : ''}
          </div>
          <div class="pred-card__champion">
            <div class="champ-label">Predicted Champion</div>
            <div class="champ-name" style="color:${champTeam?.color||'var(--gold)'}">
              ${champTeam ? champTeam.name : '—'}
            </div>
          </div>
        </div>
        <div class="bracket-display">
          ${bracketColumn('QUALIFIER', [
            { team: q_t1, winner: qualWinner === q_t1 },
            { team: q_t2, winner: qualWinner === q_t2 },
          ])}
          ${bracketColumn('ELIMINATOR 1', [
            { team: e1_t1, winner: e1Winner === e1_t1 },
            { team: e1_t2, winner: e1Winner === e1_t2 },
          ])}
          ${bracketColumn('ELIMINATOR 2', [
            { team: e2_t1, winner: e2Winner === e2_t1 },
            { team: e2_t2, winner: e2Winner === e2_t2 },
          ])}
          ${bracketColumn('FINAL 🏆', [
            { team: f_t1, winner: champion === f_t1, isChamp: champion === f_t1 },
            { team: f_t2, winner: champion === f_t2, isChamp: champion === f_t2 },
          ])}
        </div>
      </div>`;
    renderChampionChart();
  }

  function bracketColumn(title, teams) {
    return `<div class="bd-round">
      <div class="bd-round__title">${title}</div>
      <div class="bd-match">
        ${teams.map(t => {
          if (!t.team) return `<div class="bd-team" style="color:var(--text-muted);font-style:italic;font-size:12px;">TBD</div>`;
          const team = TEAMS[t.team];
          return `<div class="bd-team ${t.winner?'winner':'loser'}">
            <span class="bd-dot" style="background:${team.color}"></span>
            ${team.name}
            ${t.winner ? `<span class="w-icon">${t.isChamp?'🏆':'→'}</span>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  function renderChampionChart() {
    const counts = {};
    completedUsers.forEach(u => {
      const champ = u.playoffPicks?.final;
      if (champ) counts[champ] = (counts[champ]||0) + 1;
    });
    const total = completedUsers.length;
    if (!total || !Object.keys(counts).length) { document.getElementById('champion-chart').innerHTML=''; return; }
    const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
    const max = sorted[0][1];
    document.getElementById('champion-chart').innerHTML = `
      <div class="champion-bar">
        <div class="champion-bar__head">🏆 Who Wins PSL 2026? — Community Vote</div>
        <div class="champion-bar__body">
          ${sorted.map(([team, count]) => {
            const t = TEAMS[team];
            const pct = Math.round(count/total*100);
            const barW = Math.round(count/max*100);
            return `<div class="champ-stat">
              <div class="champ-stat__team">${teamAvatar(team,28)}<span style="color:${t.color}">${t.name}</span></div>
              <div class="champ-stat__bar-wrap"><div class="champ-stat__bar" style="width:${barW}%;background:${t.color}"></div></div>
              <div class="champ-stat__count">${count}/${total} <span style="color:var(--text-muted);font-size:11px;">(${pct}%)</span></div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }

  initPage();
</script>
</body>
</html>
