<style>
  .page-hero {
    border-bottom: 1px solid var(--border);
    padding: 32px 24px 28px;
    position: relative; z-index: 1; overflow: hidden;
  }
  .page-hero::after {
    content: 'SQUADS';
    position: absolute; right: -8px; top: -8px;
    font-family: var(--font-head); font-size: 100px;
    color: rgba(0,230,118,.03); pointer-events: none; line-height: 1;
  }
  .page-hero__eyebrow {
    font-family: var(--font-cond); font-size: 12px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--green); margin-bottom: 6px;
  }
  .page-hero__title {
    font-family: var(--font-head); font-size: clamp(32px,5vw,56px);
    letter-spacing: 3px; line-height: 1; margin-bottom: 6px;
  }
  .page-hero__title span { color: var(--gold); }
  .page-hero__sub { color: var(--text-dim); font-size: 14px; }

  /* Controls */
  .controls-bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 66px; z-index: 100;
  }
  .ctrl-label {
    font-family: var(--font-cond); font-size: 11px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted);
    white-space: nowrap;
  }
  .ctrl-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .ctrl-btn {
    background: var(--bg); border: 1px solid var(--border2); border-radius: 4px;
    color: var(--text-dim); font-family: var(--font-cond);
    font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    padding: 6px 13px; cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .ctrl-btn:hover { border-color: var(--green); color: var(--text); }
  .ctrl-btn.active { background: var(--green); color: #000; border-color: var(--green); }
  .ctrl-sep { width: 1px; height: 24px; background: var(--border2); flex-shrink: 0; }

  /* Role filters */
  .role-filter-btn {
    font-family: var(--font-cond); font-size: 11px; font-weight: 700;
    letter-spacing: .5px; padding: 5px 12px; border-radius: 3px;
    cursor: pointer; border: 1px solid var(--border2); background: var(--bg);
    color: var(--text-dim); transition: all .15s;
  }
  .role-filter-btn.rf-all  { background: var(--green); color: #000; border-color: var(--green); }
  .role-filter-btn.rf-bat  { background: rgba(30,140,255,.15); color: #5bb8ff; border-color: rgba(30,140,255,.35); }
  .role-filter-btn.rf-wk   { background: rgba(255,196,0,.15); color: var(--gold); border-color: rgba(255,196,0,.35); }
  .role-filter-btn.rf-ar   { background: rgba(0,230,118,.15); color: var(--green); border-color: rgba(0,230,118,.35); }
  .role-filter-btn.rf-bwl  { background: rgba(255,80,80,.12); color: #ff7070; border-color: rgba(255,80,80,.3); }

  /* Grid */
  .squads-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 24px; padding: 28px 24px;
    position: relative; z-index: 1;
  }
  .squads-grid.single-view { grid-template-columns: 1fr; max-width: 680px; margin: 0 auto; }

  /* Card */
  .squad-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }
  .squad-card__head {
    padding: 16px 20px; display: flex; align-items: center; gap: 14px;
    position: relative; overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  .squad-card__head::after {
    content: attr(data-abbr);
    position: absolute; right: -6px; top: -4px;
    font-family: var(--font-head); font-size: 60px;
    opacity: .06; pointer-events: none; line-height: 1;
  }
  .squad-avatar {
    width: 44px; height: 44px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-head); font-size: 14px;
    flex-shrink: 0; border: 2px solid;
  }
  .squad-card__info { flex: 1; min-width: 0; }
  .squad-card__name {
    font-family: var(--font-head); font-size: 20px; letter-spacing: 2px;
    line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .squad-card__meta {
    font-family: var(--font-cond); font-size: 11px; color: var(--text-muted);
    letter-spacing: 1px; margin-top: 3px;
  }
  .squad-count {
    font-family: var(--font-head); font-size: 28px; opacity: .4; flex-shrink: 0;
  }

  /* Player rows */
  .player-list { }
  .player-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-bottom: 1px solid var(--border);
    transition: background .1s;
  }
  .player-row:last-child { border-bottom: none; }
  .player-row:hover { background: rgba(255,255,255,.02); }
  .player-row.p-hidden { display: none; }
  .p-num {
    font-family: var(--font-cond); font-size: 11px; font-weight: 700;
    color: var(--text-muted); width: 18px; flex-shrink: 0; text-align: right;
  }
  .p-name {
    font-family: var(--font-cond); font-size: 13px; font-weight: 700;
    flex: 1; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .p-intl { opacity: .6; font-size: 11px; margin-right: 2px; }
  .p-cap {
    display: inline-block; font-size: 9px; font-family: var(--font-cond);
    font-weight: 700; padding: 1px 5px; border-radius: 2px;
    background: var(--gold); color: #000; margin-left: 3px; vertical-align: middle;
  }
  .p-role {
    font-family: var(--font-cond); font-size: 10px; font-weight: 700;
    padding: 2px 6px; border-radius: 3px; flex-shrink: 0;
  }
  .p-role-BAT { background: rgba(30,140,255,.15); color: #5bb8ff; border: 1px solid rgba(30,140,255,.2); }
  .p-role-WK  { background: rgba(255,196,0,.12);  color: var(--gold);  border: 1px solid rgba(255,196,0,.2); }
  .p-role-AR  { background: rgba(0,230,118,.12);  color: var(--green); border: 1px solid rgba(0,230,118,.2); }
  .p-role-BWL { background: rgba(255,80,80,.1);   color: #ff7070; border: 1px solid rgba(255,80,80,.18); }
  .p-price {
    font-family: var(--font-cond); font-size: 10px; font-weight: 700;
    color: var(--text-muted); white-space: nowrap; flex-shrink: 0; min-width: 56px; text-align: right;
  }
  .no-results {
    grid-column: 1/-1; text-align: center; padding: 60px;
    color: var(--text-muted); font-family: var(--font-cond);
    font-size: 18px; font-weight: 700; letter-spacing: 2px;
  }
  @media(max-width:700px) {
    .squads-grid { grid-template-columns: 1fr; padding: 16px; }
    .controls-bar { padding: 12px 16px; gap: 8px; }
  }
</style>
</head>

const ROLE_LABELS = { BAT:'Batter', WK:'Wicketkeeper', AR:'All-rounder', BWL:'Bowler' };
let activeTeam = 'ALL';
let activeRole = 'ALL';

document.getElementById('nav-placeholder').innerHTML = renderNav('squads');

/* ─── Build team buttons ─── */
document.getElementById('team-btns').innerHTML =
  `<button class="ctrl-btn active" onclick="setTeam('ALL',this)">All Teams</button>` +
  Object.keys(TEAMS).map(k => {
    const t = TEAMS[k];
    return `<button class="ctrl-btn" data-key="${k}" onclick="setTeam('${k}',this)">${(typeof LOGOS!=='undefined'&&LOGOS[k])?`<img src="${LOGOS[k]}" style="height:20px;width:20px;object-fit:contain;vertical-align:middle;margin-right:5px;" alt=""/>`:''}${t.abbr}</button>`;
  }).join('');

/* ─── Build role buttons ─── */
document.getElementById('role-btns').innerHTML = [
  { r:'ALL', label:'All',           cls:'rf-all'  },
  { r:'BAT', label:'🏏 Batters',    cls:'rf-bat'  },
  { r:'WK',  label:'🧤 Keepers',    cls:'rf-wk'   },
  { r:'AR',  label:'⚡ All-rounders',cls:'rf-ar'  },
  { r:'BWL', label:'🎯 Bowlers',    cls:'rf-bwl'  },
].map(b => `<button class="role-filter-btn ${b.r==='ALL'?'rf-all':''}" data-role="${b.r}" onclick="setRole('${b.r}',this)">${b.label}</button>`).join('');

/* ─── Filter setters ─── */
function setTeam(key, btn) {
  activeTeam = key;
  document.querySelectorAll('#team-btns .ctrl-btn').forEach(b => {
    b.classList.remove('active');
    b.style.cssText = '';
  });
  btn.classList.add('active');
  if (key !== 'ALL') {
    const t = TEAMS[key];
    btn.style.background = t.color;
    btn.style.borderColor = t.color;
    btn.style.color = '#000';
  }
  render();
}
function setRole(r, btn) {
  activeRole = r;
  document.querySelectorAll('#role-btns .role-filter-btn').forEach(b => {
    b.className = 'role-filter-btn';
  });
  const cls = { ALL:'rf-all', BAT:'rf-bat', WK:'rf-wk', AR:'rf-ar', BWL:'rf-bwl' }[r];
  btn.className = `role-filter-btn ${cls}`;
  render();
}

/* ─── Render ─── */
function render() {
  const grid = document.getElementById('squads-grid');
  const keys = activeTeam === 'ALL' ? Object.keys(TEAMS) : [activeTeam];
  grid.className = 'squads-grid' + (keys.length === 1 ? ' single-view' : '');

  let html = '';
  keys.forEach(key => {
    const t = TEAMS[key];
    const sq = SQUADS[key];
    if (!sq) return;

    const visible = sq.players.filter(p => activeRole === 'ALL' || p.role === activeRole);
    if (visible.length === 0) return;

    html += `<div class="squad-card" style="border-color:${t.color}30;">
      <div class="squad-card__head" data-abbr="${t.abbr}"
        style="background:linear-gradient(135deg,${t.color}1a 0%,transparent 70%);">
        <div class="squad-avatar" style="background:${t.color}22;border-color:${t.color};color:${t.color};">${(typeof LOGOS!=='undefined'&&LOGOS[key])?`<img src="${LOGOS[key]}" alt="${t.name}" style="width:36px;height:36px;object-fit:contain;"/>`:t.abbr}</div>
        <div class="squad-card__info">
          <div class="squad-card__name" style="color:${t.color}">${t.name}</div>
          <div class="squad-card__meta">GRP ${t.group} &nbsp;·&nbsp; ${sq.players.filter(p=>p.intl).length} OVERSEAS &nbsp;·&nbsp; ${sq.players.length} PLAYERS</div>
        </div>
        <div class="squad-count" style="color:${t.color}">${visible.length}</div>
      </div>
      <div class="player-list">
        ${sq.players.map((p, i) => {
          const hide = activeRole !== 'ALL' && p.role !== activeRole;
          return `<div class="player-row${hide ? ' p-hidden' : ''}">
            <span class="p-num">${i+1}</span>
            <span class="p-name">${p.intl ? '<span class="p-intl">✈</span>' : ''}${p.name}${p.cap ? '<span class="p-cap">C</span>' : ''}</span>
            <span class="p-role p-role-${p.role}" title="${ROLE_LABELS[p.role]}">${p.role}</span>
            <span class="p-price">${p.price}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  });

  grid.innerHTML = html || `<div class="no-results">No players match this filter.</div>`;
}
